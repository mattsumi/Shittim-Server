name: Build and Release Shittim Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run tests
        run: dotnet test ./Shittim-Server.Tests/Shittim-Server.Tests.csproj -c Release --nologo

      - name: Publish server runtime
        run: dotnet publish ./Shittim-Server/Shittim-Server.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o ./server-runtime

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item ./server-runtime pkg/server-runtime -Recurse
          Copy-Item ./README.md pkg/README.md
          Copy-Item ./Scripts pkg/Scripts -Recurse
          Compress-Archive -Path pkg/* -DestinationPath "Shittim-Server-${{ matrix.rid }}.zip" -Force

      - name: Package (POSIX)
        if: matrix.rid != 'win-x64'
        run: |
          mkdir -p pkg/server-runtime
          cp -r ./server-runtime/. pkg/server-runtime/
          cp ./README.md pkg/README.md
          cp -r ./Scripts pkg/Scripts
          tar -czf "Shittim-Server-${{ matrix.rid }}.tar.gz" -C pkg .

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: Shittim-Server-${{ matrix.rid }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          if [ -z "$version" ]; then echo "no <Version> in Directory.Build.props"; exit 1; fi
          package=$(node -p "require('./ShittimControlCenter/package.json').version")
          if [ "$package" != "$version" ]; then echo "Directory.Build.props is $version but package.json is $package"; exit 1; fi
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then echo "$tag already exists - bump the version before releasing"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all runtimes
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
